name: Deploy Farm Manager

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: farm-manager-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pull latest code and deploy Compose
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: 22
          #fingerprint: ${{ secrets.VM_HOST_FINGERPRINT }}
          command_timeout: 15m
          request_pty: false
          script: |
            set -e
            APP_DIR=/opt/farm-manager
            REPO_URL=git@github.com:Tobymayor24/farmingapp.git

            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git pull --ff-only origin main
            else
              if [ -d "$APP_DIR" ] && [ -n "$(ls -A "$APP_DIR")" ]; then
                echo "Error: $APP_DIR exists and is not an empty Git checkout; refusing to overwrite it." >&2
                exit 1
              fi
              mkdir -p "$(dirname "$APP_DIR")"
              git clone --branch main --single-branch "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            fi

            docker compose up -d --build --remove-orphans
            docker compose ps
