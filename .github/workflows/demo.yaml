name: Deploy Farm Manager

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: farm-manager-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pull latest code and deploy Compose
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: 22
          #fingerprint: ${{ secrets.VM_HOST_FINGERPRINT }}
          command_timeout: 15m
          request_pty: false
          script: |
            set -e
            cd /opt/farm-manager
            git pull --ff-only origin main
            docker compose up -d --build --remove-orphans
            docker compose ps
