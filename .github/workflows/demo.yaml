name: Deploy Farm Manager

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: farm-manager-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/farm_manager_deploy_key
          chmod 600 ~/.ssh/farm_manager_deploy_key
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull latest code and deploy Compose
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/farm_manager_deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" <<'REMOTE'
          set -euo pipefail
          cd /opt/farm-manager
          git pull --ff-only origin main
          docker compose up -d --build --remove-orphans
          docker compose ps
          REMOTE
